server.port=8080
spring.application.name=java-spring-boot-rest-api
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
app.pricing.tax-rate-percent=8.0
app.pricing.default-discount-percent=0.0
app.security.api-key=demo-key-java25
app.events.max-queue-size=1000
app.runtime.java-version=25
app.runtime.feature.payments=true
app.runtime.feature.notifications=true
app.runtime.feature.analytics=true
app.warehouse.default-capacity=500
